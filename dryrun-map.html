<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Species Map — Dry Run</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bee-gold: #FCD833;
    --bee-black: #000000;
    --bee-orange: #FA9727;
    --bee-orange-dark: #D8562A;
    --bee-sky: #8CBCE2;
    --bg: #ffffff;
    --text: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a;
      --text: #e8e8e8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a;
    --text: #e8e8e8;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
    box-sizing: border-box;
    padding: 10px;
  }
  #header {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bee-gold);
    border: 2px solid var(--bee-black);
    display: inline-block;
  }
  #map {
    flex: 1;
    min-height: 300px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #ddd;
  }
  #footer {
    font-size: 11px;
    color: #888;
    margin-top: 6px;
    text-align: right;
  }
  .leaflet-popup-content-wrapper {
    border-radius: 6px;
  }
  .leaflet-popup-content b {
    color: var(--bee-orange-dark);
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="header"><span class="dot"></span>Dry run — fake occurrence points (Minnesota)</div>
  <div id="map" role="img" aria-label="Map showing 5 fake occurrence points across Minnesota, used to test embedding this map on another site."></div>
  <div id="footer">Test data only — not real occurrence records</div>
</div>
<p class="sr-only" id="map-summary">Map showing 5 fake occurrence points across Minnesota, used to test embedding this map on another site.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  // Fake GeoJSON, inlined for this dry run (final version fetches a real .geojson file)
  // Deliberately sparse on some records to test the showMissingFields placeholder behavior
  var fakeData = {
    "type": "FeatureCollection",
    "features": [
      { "type": "Feature", "geometry": { "type": "Point", "coordinates": [-93.2650, 44.9778] },
        "properties": {
          "scientificName": "Bombus affinis",
          "locality": "Minneapolis, Hennepin Co., MN",
          "recordedBy": "J. Abel",
          "eventDate": "2019-07-14",
          "identifiedBy": "F. Hogland",
          "lifeStage": "Adult",
          "sex": "Female",
          "occurrenceRemarks": "Foraging on Monarda fistulosa",
          "sourceName": "iNaturalist",
          "sourceUrl": "https://www.gbif.org/occurrence/1234567890"
        } },
      { "type": "Feature", "geometry": { "type": "Point", "coordinates": [-92.1005, 46.7867] },
        "properties": {
          "scientificName": "Bombus affinis",
          "eventDate": "2020-08-03",
          "sourceName": "GBIF",
          "sourceUrl": "https://www.gbif.org/occurrence/2234567890"
        } },
      { "type": "Feature", "geometry": { "type": "Point", "coordinates": [-92.4802, 44.0121] },
        "properties": {
          "scientificName": "Bombus affinis",
          "locality": "Rochester, Olmsted Co., MN",
          "eventDate": "2021-06-21",
          "sex": "Male",
          "sourceName": "iNaturalist",
          "sourceUrl": "https://www.gbif.org/occurrence/3234567890"
        } },
      { "type": "Feature", "geometry": { "type": "Point", "coordinates": [-94.1622, 45.5579] },
        "properties": {
          "scientificName": "Bombus affinis",
          "locality": "St. Cloud, Stearns Co., MN",
          "recordedBy": "M. Ito",
          "eventDate": "2023-05-30",
          "identifiedBy": "M. Ito",
          "lifeStage": "Adult",
          "sourceName": "Bumble Bee Watch",
          "sourceUrl": "https://www.gbif.org/occurrence/4234567890"
        } },
      { "type": "Feature", "geometry": { "type": "Point", "coordinates": [-95.9967, 47.4735] },
        "properties": {
          "scientificName": "Bombus affinis",
          "eventDate": "2020-07-04",
          "occurrenceRemarks": "Nest site nearby",
          "sourceName": "iNaturalist",
          "sourceUrl": "https://www.gbif.org/occurrence/5234567890"
        } }
    ]
  };

  // Controls whether absent fields render as "Missing" (true, default) or are skipped (false)
  var showMissingFields = true;

  function buildPopupHtml(props) {
    var MISSING = 'Missing';
    function val(key) {
      var v = props[key];
      return (v === undefined || v === null || v === '') ? null : v;
    }
    var rows = [];

    // Species name — always present, italicized, not a labeled row
    var nameHtml = '<div style="font-style:italic;font-weight:600;margin-bottom:4px;">' +
      (val('scientificName') || MISSING) + '</div>';

    // Coordinates — derived from geometry, always present
    var coordRow = '<b>Coordinates:</b> ' + (val('coordinates') || MISSING);
    rows.push(coordRow);

    var fieldDefs = [
      { label: 'Locality', key: 'locality' },
      { label: 'Recorded by', key: 'recordedBy' },
      { label: 'Date found', key: 'eventDate' },
      { label: 'Determined by', key: 'identifiedBy' },
      { label: 'Life Stage', key: 'lifeStage' },
      { label: 'Sex', key: 'sex' },
      { label: 'Notes', key: 'occurrenceRemarks' }
    ];

    fieldDefs.forEach(function (f) {
      var v = val(f.key);
      if (v === null) {
        if (showMissingFields) {
          rows.push('<b>' + f.label + ':</b> <span style="color:#999;">' + MISSING + '</span>');
        }
        // if showMissingFields is false, skip the row entirely
      } else {
        rows.push('<b>' + f.label + ':</b> ' + v);
      }
    });

    // Source — always a hyperlink; label from sourceName, fallback "GBIF"
    var sourceUrl = val('sourceUrl');
    var sourceName = val('sourceName') || 'GBIF';
    var sourceHtml = sourceUrl
      ? '<b>Source:</b> <a href="' + sourceUrl + '" target="_blank" rel="noopener" style="color:#8CBCE2;">' + sourceName + '</a>'
      : (showMissingFields ? '<b>Source:</b> <span style="color:#999;">' + MISSING + '</span>' : '');
    if (sourceHtml) rows.push(sourceHtml);

    return nameHtml +
      '<div style="font-size:12.5px;line-height:1.6;">' + rows.join('<br>') + '</div>';
  }

  try {
    var map = L.map('map', { scrollWheelZoom: true }).setView([46.0, -94.5], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      subdomains: 'abc',
      maxZoom: 19
    }).addTo(map);

    var goldIcon = L.divIcon({
      className: '',
      html: '<div style="width:14px;height:14px;border-radius:50%;background:#FCD833;border:2px solid #000;"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });

    L.geoJSON(fakeData, {
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng, { icon: goldIcon });
      },
      onEachFeature: function (feature, layer) {
        var props = Object.assign({}, feature.properties, {
          coordinates: feature.geometry.coordinates[1].toFixed(4) + ', ' + feature.geometry.coordinates[0].toFixed(4)
        });
        layer.bindPopup(buildPopupHtml(props), { maxWidth: 260 });
      }
    }).addTo(map);
  } catch (e) {
    document.getElementById('map').innerHTML =
      '<div style="padding:20px;color:#900;">Map failed to load: ' + e.message + '</div>';
  }
</script>
</body>
</html>
